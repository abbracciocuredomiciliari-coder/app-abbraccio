services:
  - type: web
    name: app-abbraccio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # da impostare manualmente su Render dashboard
      - key: JWT_SECRET
        sync: false   # da impostare manualmente su Render dashboard
      # Cloudinary — storage persistente per gli allegati (piano gratuito disponibile)
      # Registrarsi su https://cloudinary.com e copiare le credenziali dal dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # da impostare manualmente su Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false   # da impostare manualmente su Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false   # da impostare manualmente su Render dashboard

      # Email notifiche — Aruba SMTP (o Brevo se già configurato)
      - key: ADMIN_EMAIL
        value: info@abbracciocuredomiciliari.it
      - key: FROM_EMAIL
        value: info@abbracciocuredomiciliari.it
      - key: SMTP_HOST
        value: smtps.aruba.it
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@abbracciocuredomiciliari.it
      - key: SMTP_PASS
        sync: false   # da impostare manualmente su Render dashboard
      - key: FRONTEND_URL
        value: https://app.abbracciocuredomiciliari.it

      # Groq AI — Speech-to-Text + LLM per dettatura vocale nel diario clinico
      - key: GROQ_API_KEY
        sync: false   # da impostare manualmente su Render dashboard
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND - Web Service con Express (per SPA routing)
  # ═══════════════════════════════════════════════════════════════════════════
  - type: web
    name: app-abbraccio-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://app-abbraccio.onrender.com/api  # URL del backend su Render
