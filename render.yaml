services:
  - type: web
    name: app-abbraccio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # da impostare manualmente su Render dashboard
      - key: JWT_SECRET
        sync: false   # da impostare manualmente su Render dashboard
      # Cloudinary — storage persistente per gli allegati (piano gratuito disponibile)
      # Registrarsi su https://cloudinary.com e copiare le credenziali dal dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # da impostare manualmente su Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false   # da impostare manualmente su Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false   # da impostare manualmente su Render dashboard

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND - Static Site (React + Vite)
  # ═══════════════════════════════════════════════════════════════════════════
  - type: static
    name: app-abbraccio-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://app-abbraccio.onrender.com/api  # URL del backend su Render
